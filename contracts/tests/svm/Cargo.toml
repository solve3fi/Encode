[package]
name = "svm-tests"
version = "0.0.0"
edition = "2021"
publish = false

# Detached from the program workspace: LiteSVM pulls newer Solana crates than
# the Anchor 0.32 programs, so the two dependency graphs must not be unified.
[workspace]

[dependencies]
litesvm = "0.17"
sha2 = "0.10"
serde_json = "1"
solana-account = "4.3"
solana-address = "~2.7"
solana-clock = "~3.2"
solana-instruction = "~3.5"
solana-message = "4.2"
solana-transaction = "4.1"

[lib]
path = "tests/common/lib.rs"

[package]
name = "vesolve"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vesolve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-spl/idl-build","anchor-lang/idl-build", "solve/idl-build"]
anchor-debug = []
# Test-only: 20 minute epochs, 20 second vote cutoff, ~7 second gate buckets.
fast-epochs = ["solve/fast-epochs"]
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"]}
anchor-spl = { version = "0.32.1", features = ["metadata"] }
mpl-token-metadata = "5.1.0"
solana-security-txt = { version = "=1.1.1" }
solve = { path = "../solve", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
